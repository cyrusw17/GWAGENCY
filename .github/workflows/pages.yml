# Builds the browsable site (tools/build-pages.mjs: status page, every groundwork-web.com page and
# every demo) and pushes it to the gh-pages branch. GitHub Pages serves that branch once
# Settings > Pages > Source is "Deploy from a branch", branch gh-pages, folder / (root).
name: Pages branch

on:
  push:
    branches: [claude/site-builder-vp2yex]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/build-pages.mjs --base "/${{ github.event.repository.name }}"
      - name: Push _site to gh-pages
        if: github.event_name != 'pull_request'
        working-directory: _site
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Pages build from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
